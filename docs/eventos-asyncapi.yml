asyncapi: 3.1.0
info:
  title: Eventos da saga Orquestra de Pagamentos
  version: 1.1.0
  description: Contrato dos fluxos assíncronos separados por domínio e suas filas de falha.
defaultContentType: application/vnd.apache.avro+avro
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Broker do ambiente Docker local.
channels:
  checkout:
    address: orquestrapay.checkout.v1
    messages:
      eventoSaga:
        $ref: '#/components/messages/eventoSaga'
  estoque:
    address: orquestrapay.estoque.v1
    messages:
      eventoSaga:
        $ref: '#/components/messages/eventoSaga'
  risco:
    address: orquestrapay.risco.v1
    messages:
      eventoSaga:
        $ref: '#/components/messages/eventoSaga'
  pagamento:
    address: orquestrapay.pagamento.v1
    messages:
      eventoSaga:
        $ref: '#/components/messages/eventoSaga'
  razao:
    address: orquestrapay.razao.v1
    messages:
      eventoSaga:
        $ref: '#/components/messages/eventoSaga'
  notificacao:
    address: orquestrapay.notificacao.v1
    messages:
      eventoSaga:
        $ref: '#/components/messages/eventoSaga'
  checkoutMorto:
    address: orquestrapay.checkout.v1.dlt
    messages:
      eventoSagaFalho:
        $ref: '#/components/messages/eventoSaga'
  estoqueMorto:
    address: orquestrapay.estoque.v1.dlt
    messages:
      eventoSagaFalho:
        $ref: '#/components/messages/eventoSaga'
  riscoMorto:
    address: orquestrapay.risco.v1.dlt
    messages:
      eventoSagaFalho:
        $ref: '#/components/messages/eventoSaga'
  pagamentoMorto:
    address: orquestrapay.pagamento.v1.dlt
    messages:
      eventoSagaFalho:
        $ref: '#/components/messages/eventoSaga'
  razaoMorto:
    address: orquestrapay.razao.v1.dlt
    messages:
      eventoSagaFalho:
        $ref: '#/components/messages/eventoSaga'
  notificacaoMorta:
    address: orquestrapay.notificacao.v1.dlt
    messages:
      eventoSagaFalho:
        $ref: '#/components/messages/eventoSaga'
operations:
  receberResultadoNoCheckout:
    action: receive
    channel:
      $ref: '#/channels/checkout'
  processarEstoque:
    action: receive
    channel:
      $ref: '#/channels/estoque'
  processarRisco:
    action: receive
    channel:
      $ref: '#/channels/risco'
  processarPagamento:
    action: receive
    channel:
      $ref: '#/channels/pagamento'
  processarRazao:
    action: receive
    channel:
      $ref: '#/channels/razao'
  processarNotificacao:
    action: receive
    channel:
      $ref: '#/channels/notificacao'
  investigarFalhasCheckout:
    action: receive
    channel:
      $ref: '#/channels/checkoutMorto'
  investigarFalhasEstoque:
    action: receive
    channel:
      $ref: '#/channels/estoqueMorto'
  investigarFalhasRisco:
    action: receive
    channel:
      $ref: '#/channels/riscoMorto'
  investigarFalhasPagamento:
    action: receive
    channel:
      $ref: '#/channels/pagamentoMorto'
  investigarFalhasRazao:
    action: receive
    channel:
      $ref: '#/channels/razaoMorto'
  investigarFalhasNotificacao:
    action: receive
    channel:
      $ref: '#/channels/notificacaoMorta'
components:
  messages:
    eventoSaga:
      name: EventoSaga
      title: Envelope versionado da saga
      summary: Comando ou fato de negócio correlacionado a uma compra.
      headers:
        type: object
        properties:
          traceparent:
            type: string
            description: Contexto W3C usado para continuar o trace distribuído.
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.12.1
        schema:
          type: record
          name: EventoSaga
          namespace: br.com.orquestrapay.contracts
          fields:
            - name: idEvento
              type: string
            - name: tipo
              type: string
            - name: versao
              type: int
              default: 1
            - name: idCorrelacao
              type: string
            - name: idEmpresa
              type: string
            - name: idCompra
              type: string
            - name: origem
              type: string
            - name: ocorridoEm
              type:
                type: long
                logicalType: timestamp-millis
            - name: sequencia
              type: long
            - name: conteudo
              type: string
            - name: traceparent
              type:
                - 'null'
                - string
              default: null
      examples:
        - name: solicitarReserva
          summary: Primeiro comando emitido pelo checkout.
          payload:
            idEvento: 11111111-1111-1111-1111-111111111111
            tipo: RESERVAR_ESTOQUE
            versao: 1
            idCorrelacao: 22222222-2222-2222-2222-222222222222
            idEmpresa: 33333333-3333-3333-3333-333333333333
            idCompra: 22222222-2222-2222-2222-222222222222
            origem: servico-checkout
            ocorridoEm: 1787486400000
            sequencia: 1
            conteudo: '{"idReserva":"44444444-4444-4444-4444-444444444444","itens":[]}'
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
