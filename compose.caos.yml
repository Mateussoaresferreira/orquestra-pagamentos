services:
  kafka:
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://toxiproxy:29092,PLAINTEXT_HOST://localhost:9092

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0", "-config=/config/proxies.json"]
    volumes:
      - ./infra/chaos/proxies.json:/config/proxies.json:ro
    ports:
      - "127.0.0.1:8474:8474"
    networks: [orquestrapay]

  criador-topicos:
    depends_on:
      kafka:
        condition: service_healthy
      toxiproxy:
        condition: service_started

  servico-checkout:
    environment:
      KAFKA_SERVIDORES: toxiproxy:29092

  servico-estoque:
    environment:
      KAFKA_SERVIDORES: toxiproxy:29092

  servico-risco:
    environment:
      KAFKA_SERVIDORES: toxiproxy:29092
      BANCO_URL: jdbc:postgresql://toxiproxy:5435/orquestrapay_risco

  servico-pagamento:
    environment:
      KAFKA_SERVIDORES: toxiproxy:29092
      PROVEDOR_PRINCIPAL_URL: http://toxiproxy:8090

  servico-razao:
    environment:
      KAFKA_SERVIDORES: toxiproxy:29092

  servico-notificacao:
    environment:
      KAFKA_SERVIDORES: toxiproxy:29092
