spring:
  application.name: simulador-provedor
  threads.virtual.enabled: true
  main.keep-alive: true
server:
  port: ${PORTA:8090}
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
provedor:
  autenticacao:
    chave-api: ${PROVEDOR_CHAVE_API}
  simulacao:
    nome: ${PROVEDOR_NOME:principal}
    chave-pix: ${PIX_CHAVE_RECEBEDOR:pix@orquestrapay.local}
    segredo-webhook: ${PROVEDOR_SEGREDO_WEBHOOK:${PROVEDOR_CHAVE_API}}
    hosts-notificacao-permitidos: ${PROVEDOR_HOSTS_NOTIFICACAO:localhost,servico-pagamento}
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never
