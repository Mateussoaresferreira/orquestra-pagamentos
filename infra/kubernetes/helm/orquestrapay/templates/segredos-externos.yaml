{{- if .Values.segredos.externos.habilitado }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: orquestrapay-aws
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.segredos.externos.regiao }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.global.contaServico.segredosNome }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orquestrapay-segredos
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: orquestrapay-aws
    kind: SecretStore
  target:
    name: {{ .Values.global.banco.segredo }}
    creationPolicy: Owner
  data:
    - secretKey: banco-usuario-mestre
      remoteRef:
        key: {{ .Values.segredos.externos.bancoArn }}
        property: username
    - secretKey: banco-senha-mestre
      remoteRef:
        key: {{ .Values.segredos.externos.bancoArn }}
        property: password
    - secretKey: banco-checkout-senha
      remoteRef:
        key: {{ .Values.segredos.externos.bancos.checkoutArn }}
        property: password
    - secretKey: banco-estoque-senha
      remoteRef:
        key: {{ .Values.segredos.externos.bancos.estoqueArn }}
        property: password
    - secretKey: banco-risco-senha
      remoteRef:
        key: {{ .Values.segredos.externos.bancos.riscoArn }}
        property: password
    - secretKey: banco-pagamento-senha
      remoteRef:
        key: {{ .Values.segredos.externos.bancos.pagamentoArn }}
        property: password
    - secretKey: banco-razao-senha
      remoteRef:
        key: {{ .Values.segredos.externos.bancos.razaoArn }}
        property: password
    - secretKey: banco-notificacao-senha
      remoteRef:
        key: {{ .Values.segredos.externos.bancos.notificacaoArn }}
        property: password
    - secretKey: banco-registro-senha
      remoteRef:
        key: {{ .Values.segredos.externos.bancos.registroArn }}
        property: password
    - secretKey: redis-senha
      remoteRef:
        key: {{ .Values.segredos.externos.aplicacaoArn }}
        property: redis-senha
    - secretKey: chave-criptografia-token
      remoteRef:
        key: {{ .Values.segredos.externos.aplicacaoArn }}
        property: chave-criptografia-token
    - secretKey: chave-api-provedor
      remoteRef:
        key: {{ .Values.segredos.externos.aplicacaoArn }}
        property: chave-api-provedor
    - secretKey: chave-api-provedor-principal
      remoteRef:
        key: {{ .Values.segredos.externos.aplicacaoArn }}
        property: chave-api-provedor-principal
    - secretKey: segredo-webhook-provedor-principal
      remoteRef:
        key: {{ .Values.segredos.externos.aplicacaoArn }}
        property: segredo-webhook-provedor-principal
    - secretKey: chave-api-provedor-contingencia
      remoteRef:
        key: {{ .Values.segredos.externos.aplicacaoArn }}
        property: chave-api-provedor-contingencia
    - secretKey: segredo-webhook-provedor-contingencia
      remoteRef:
        key: {{ .Values.segredos.externos.aplicacaoArn }}
        property: segredo-webhook-provedor-contingencia
{{- end }}
