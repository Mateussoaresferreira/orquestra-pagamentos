{{- if .Values.karpenter.habilitado }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: orquestrapay
  labels:
    {{- include "orquestrapay.rotulos" . | nindent 4 }}
spec:
  amiFamily: AL2023
  role: {{ required "karpenter.funcaoNos e obrigatorio" .Values.karpenter.funcaoNos | quote }}
  amiSelectorTerms:
    - alias: {{ required "karpenter.aliasAmi e obrigatorio" .Values.karpenter.aliasAmi | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "karpenter.identificadorDescoberta e obrigatorio" .Values.karpenter.identificadorDescoberta | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.karpenter.identificadorDescoberta | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 80Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  detailedMonitoring: true
  tags:
    Projeto: orquestrapay
    Gerenciado: karpenter
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: orquestrapay
  labels:
    {{- include "orquestrapay.rotulos" . | nindent 4 }}
spec:
  weight: 50
  template:
    metadata:
      labels:
        orquestrapay.com/capacidade: dinamica
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: orquestrapay
      expireAfter: {{ .Values.karpenter.expirarApos }}
      terminationGracePeriod: 2m
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ .Values.karpenter.tiposCapacidade | toJson }}
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: {{ .Values.karpenter.familiasInstancia | toJson }}
  limits:
    cpu: {{ .Values.karpenter.limiteCpu | quote }}
    memory: {{ .Values.karpenter.limiteMemoria | quote }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: {{ .Values.karpenter.consolidarApos }}
    budgets:
      - nodes: "10%"
{{- end }}
