{{- if .Values.autoscalonamento.habilitado }}
{{- range .Values.servicos }}
{{- if gt (int .replicas) 1 }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .nome }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .nome }}
  minReplicas: {{ $.Values.autoscalonamento.minimoReplicas }}
  maxReplicas: {{ $.Values.autoscalonamento.maximoReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscalonamento.cpuMedia }}
---
{{- end }}
{{- end }}
{{- end }}
