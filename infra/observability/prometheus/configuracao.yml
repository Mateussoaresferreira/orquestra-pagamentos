global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: coletor-otel
    static_configs:
      - targets: ["coletor-otel:9464"]

  - job_name: orquestrapay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - servico-checkout:8080
          - servico-estoque:8080
          - servico-risco:8080
          - servico-pagamento:8080
          - servico-razao:8080
          - servico-notificacao:8080
          - simulador-provedor:8080
          - simulador-provedor-contingencia:8080
