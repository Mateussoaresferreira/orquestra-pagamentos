name: Ponta a ponta distribuido

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 6"

permissions:
  contents: read

concurrency:
  group: ponta-a-ponta-orquestrapay
  cancel-in-progress: true

jobs:
  saga:
    name: Validar saga e compensacoes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_BAKE: "false"
      COMPOSE_PARALLEL_LIMIT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Empacotar aplicacoes
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests
      - name: Construir imagens
        run: >-
          docker compose build
          simulador-provedor servico-checkout servico-estoque servico-risco
          servico-pagamento servico-razao servico-notificacao
      - name: Iniciar nucleo distribuido
        run: >-
          docker compose up -d --wait
          banco-checkout banco-estoque banco-risco banco-pagamento banco-razao
          banco-notificacao banco-registro redis kafka criador-topicos
          registro-esquemas registrador-esquemas simulador-provedor servico-checkout servico-estoque
          servico-risco servico-pagamento servico-razao servico-notificacao
      - name: Executar cenarios reais
        shell: pwsh
        run: ./scripts/testar-cenarios.ps1
      - name: Executar DAST da API
        shell: pwsh
        run: ./scripts/testar-dast.ps1
      - name: Coletar logs
        if: always()
        run: docker compose logs --no-color > registros-compose.log
      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registros-ponta-a-ponta
          path: |
            registros-compose.log
            .auditoria/zap-*.*
          if-no-files-found: warn
          retention-days: 7
      - name: Encerrar ambiente
        if: always()
        run: docker compose down --volumes --remove-orphans
