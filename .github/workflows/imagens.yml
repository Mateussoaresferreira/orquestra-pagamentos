name: Construir imagens

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/**"
      - "support/**"
      - "libs/**"
      - "docker/**"
      - "pom.xml"

permissions:
  contents: read

jobs:
  empacotar:
    name: Empacotar aplicacoes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aplicacoes-java
          path: |
            services/*/target/*.jar
            support/*/target/*.jar
            !**/*.jar.original
          retention-days: 1

  construir:
    name: Imagem ${{ matrix.nome }}
    needs: empacotar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: servico-checkout
            contexto: services/checkout-service
            artefato: target/servico-checkout-1.0.0.jar
          - nome: servico-estoque
            contexto: services/inventory-service
            artefato: target/servico-estoque-1.0.0.jar
          - nome: servico-risco
            contexto: services/risk-service
            artefato: target/servico-risco-1.0.0.jar
          - nome: servico-pagamento
            contexto: services/payment-service
            artefato: target/servico-pagamento-1.0.0.jar
          - nome: servico-razao
            contexto: services/ledger-service
            artefato: target/servico-razao-1.0.0.jar
          - nome: servico-notificacao
            contexto: services/notification-service
            artefato: target/servico-notificacao-1.0.0.jar
          - nome: simulador-provedor
            contexto: support/provider-simulator
            artefato: target/simulador-provedor-1.0.0.jar
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aplicacoes-java
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.contexto }}
          file: docker/Dockerfile
          push: false
          tags: orquestrapay/${{ matrix.nome }}:${{ github.sha }}
          build-args: CAMINHO_ARTEFATO=${{ matrix.artefato }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
