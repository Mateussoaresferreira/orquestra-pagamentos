spring:
  application.name: servico-notificacao
  threads.virtual.enabled: true
  main.keep-alive: true
  datasource:
    url: ${BANCO_URL:jdbc:postgresql://localhost:5438/orquestrapay_notificacao}
    username: ${BANCO_USUARIO:orquestrapay}
    password: ${BANCO_SENHA}
  flyway.locations: classpath:db/migration/shared,classpath:db/migration/service
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORTA:1025}
    username: ${SMTP_USUARIO:}
    password: ${SMTP_SENHA:}
    properties:
      mail.smtp.auth: ${SMTP_AUTENTICACAO:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_OBRIGATORIO:${SMTP_STARTTLS:false}}
      mail.smtp.ssl.checkserveridentity: ${SMTP_VALIDAR_IDENTIDADE_HOST:true}
      mail.smtp.connectiontimeout: ${SMTP_TEMPO_CONEXAO_MS:2000}
      mail.smtp.timeout: ${SMTP_TEMPO_RESPOSTA_MS:5000}
      mail.smtp.writetimeout: ${SMTP_TEMPO_ESCRITA_MS:5000}
  kafka:
    bootstrap-servers: ${KAFKA_SERVIDORES:localhost:9092}
    consumer:
      group-id: notificacao-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
      acks: all
    listener.ack-mode: record
    properties:
      apicurio.registry.url: ${REGISTRO_ESQUEMAS_URL:http://localhost:8088/apis/registry/v3}
      apicurio.registry.canonicalize: true
      apicurio.registry.auto-register: ${REGISTRO_AUTO_CADASTRAR:true}
      apicurio.registry.use-specific-avro-reader: true
server:
  port: ${PORTA:8085}
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
orquestrapay:
  criptografia:
    chave-token-base64: ${CHAVE_CRIPTOGRAFIA_TOKEN}
  seguranca:
    habilitada: ${SEGURANCA_HABILITADA:true}
    emissor: ${OIDC_EMISSOR:}
    clientes-id: ${OIDC_CLIENTES_ID:${OIDC_CLIENTE_ID:}}
    cliente-maquina-id: ${OIDC_CLIENTE_MAQUINA_ID:}
    empresa-cliente-maquina: ${OIDC_EMPRESA_CLIENTE_MAQUINA:}
  eventos:
    habilitado: false
    topicos:
      checkout: ${TOPICO_CHECKOUT:orquestrapay.checkout.v1}
      estoque: ${TOPICO_ESTOQUE:orquestrapay.estoque.v1}
      risco: ${TOPICO_RISCO:orquestrapay.risco.v1}
      pagamento: ${TOPICO_PAGAMENTO:orquestrapay.pagamento.v1}
      razao: ${TOPICO_RAZAO:orquestrapay.razao.v1}
      notificacao: ${TOPICO_NOTIFICACAO:orquestrapay.notificacao.v1}
    particoes: ${TOPICOS_PARTICOES:12}
  retencao-eventos:
    habilitada: ${RETENCAO_EVENTOS_HABILITADA:true}
    tamanho-lote: ${RETENCAO_EVENTOS_TAMANHO_LOTE:1000}
    processados: ${RETENCAO_EVENTOS_PROCESSADOS:90d}
    publicados: ${RETENCAO_EVENTOS_PUBLICADOS:7d}
    quarentena: ${RETENCAO_EVENTOS_QUARENTENA:365d}
    intervalo: ${RETENCAO_EVENTOS_INTERVALO:1h}
    atraso-inicial: ${RETENCAO_EVENTOS_ATRASO_INICIAL:5m}
  notificacoes:
    remetente: ${NOTIFICACOES_REMETENTE:nao-responda@orquestrapay.local}
    tamanho-lote: ${NOTIFICACOES_TAMANHO_LOTE:50}
    concorrencia: ${NOTIFICACOES_CONCORRENCIA:8}
    intervalo: ${NOTIFICACOES_INTERVALO_MS:250}
    maximo-tentativas: ${NOTIFICACOES_MAXIMO_TENTATIVAS:5}
    duracao-bloqueio: ${NOTIFICACOES_DURACAO_BLOQUEIO:30s}
    atraso-base: ${NOTIFICACOES_ATRASO_BASE:2s}
    atraso-maximo: ${NOTIFICACOES_ATRASO_MAXIMO:10m}
  webhooks:
    tamanho-lote: ${WEBHOOKS_TAMANHO_LOTE:20}
    maximo-tentativas: ${WEBHOOKS_MAXIMO_TENTATIVAS:10}
    duracao-bloqueio: ${WEBHOOKS_DURACAO_BLOQUEIO:30s}
    atraso-base: ${WEBHOOKS_ATRASO_BASE:5s}
    atraso-maximo: ${WEBHOOKS_ATRASO_MAXIMO:6h}
    tempo-conexao: ${WEBHOOKS_TEMPO_CONEXAO:2s}
    tempo-resposta: ${WEBHOOKS_TEMPO_RESPOSTA:5s}
    permitir-enderecos-privados: ${WEBHOOKS_PERMITIR_ENDERECOS_PRIVADOS:false}
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: 1.0
---
spring:
  config.activate.on-profile: platform-threads
  threads.virtual.enabled: false
