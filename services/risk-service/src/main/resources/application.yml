spring:
  application.name: servico-risco
  threads.virtual.enabled: true
  main.keep-alive: true
  datasource:
    url: ${BANCO_URL:jdbc:postgresql://localhost:5435/orquestrapay_risco}
    username: ${BANCO_USUARIO:orquestrapay}
    password: ${BANCO_SENHA}
  flyway.locations: classpath:db/migration/shared,classpath:db/migration/service
  kafka:
    bootstrap-servers: ${KAFKA_SERVIDORES:localhost:9092}
    consumer:
      group-id: risco-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
      acks: all
    listener.ack-mode: record
    properties:
      apicurio.registry.url: ${REGISTRO_ESQUEMAS_URL:http://localhost:8088/apis/registry/v3}
      apicurio.registry.auto-register: ${REGISTRO_AUTO_CADASTRAR:true}
      apicurio.registry.use-specific-avro-reader: true
server:
  port: ${PORTA:8082}
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
orquestrapay:
  seguranca:
    habilitada: ${SEGURANCA_HABILITADA:true}
    emissor: ${OIDC_EMISSOR:}
    clientes-id: ${OIDC_CLIENTES_ID:${OIDC_CLIENTE_ID:}}
    cliente-maquina-id: ${OIDC_CLIENTE_MAQUINA_ID:}
    empresa-cliente-maquina: ${OIDC_EMPRESA_CLIENTE_MAQUINA:}
  eventos:
    habilitado: true
    topicos:
      checkout: ${TOPICO_CHECKOUT:orquestrapay.checkout.v1}
      estoque: ${TOPICO_ESTOQUE:orquestrapay.estoque.v1}
      risco: ${TOPICO_RISCO:orquestrapay.risco.v1}
      pagamento: ${TOPICO_PAGAMENTO:orquestrapay.pagamento.v1}
      razao: ${TOPICO_RAZAO:orquestrapay.razao.v1}
      notificacao: ${TOPICO_NOTIFICACAO:orquestrapay.notificacao.v1}
    particoes: ${TOPICOS_PARTICOES:12}
    intervalo-publicacao: 300
  retencao-eventos:
    habilitada: ${RETENCAO_EVENTOS_HABILITADA:true}
    tamanho-lote: ${RETENCAO_EVENTOS_TAMANHO_LOTE:1000}
    processados: ${RETENCAO_EVENTOS_PROCESSADOS:90d}
    publicados: ${RETENCAO_EVENTOS_PUBLICADOS:7d}
    quarentena: ${RETENCAO_EVENTOS_QUARENTENA:365d}
    intervalo: ${RETENCAO_EVENTOS_INTERVALO:1h}
    atraso-inicial: ${RETENCAO_EVENTOS_ATRASO_INICIAL:5m}
  risco:
    retencao-comparacoes:
      habilitada: ${RISCO_COMPARACOES_RETENCAO_HABILITADA:true}
      tamanho-lote: ${RISCO_COMPARACOES_RETENCAO_TAMANHO_LOTE:1000}
      periodo: ${RISCO_COMPARACOES_RETENCAO_PERIODO:90d}
      intervalo: ${RISCO_COMPARACOES_RETENCAO_INTERVALO:1h}
      atraso-inicial: ${RISCO_COMPARACOES_RETENCAO_ATRASO_INICIAL:15m}
    modelos:
      nome-champion: ${RISCO_MODELO_CHAMPION:regras-transacionais}
      versao-champion: ${RISCO_VERSAO_CHAMPION:1.0.0}
      challenger-habilitado: ${RISCO_CHALLENGER_HABILITADO:true}
      nome-challenger: ${RISCO_MODELO_CHALLENGER:regras-transacionais}
      versao-challenger: ${RISCO_VERSAO_CHALLENGER:1.1.0}
      percentual-amostragem: ${RISCO_CHALLENGER_AMOSTRAGEM:100}
      politica-challenger:
        limite-valor-alto: ${RISCO_CHALLENGER_LIMITE_VALOR_ALTO:800.00}
        limite-valor-muito-alto: ${RISCO_CHALLENGER_LIMITE_VALOR_MUITO_ALTO:4000.00}
        pontos-valor-alto: ${RISCO_CHALLENGER_PONTOS_VALOR_ALTO:20}
        pontos-valor-muito-alto: ${RISCO_CHALLENGER_PONTOS_VALOR_MUITO_ALTO:50}
        pais-base: ${RISCO_CHALLENGER_PAIS_BASE:BR}
        pontos-pais-divergente: ${RISCO_CHALLENGER_PONTOS_PAIS_DIVERGENTE:30}
        limite-compras-recentes: ${RISCO_CHALLENGER_LIMITE_COMPRAS_RECENTES:3}
        janela-compras-recentes: ${RISCO_CHALLENGER_JANELA_COMPRAS_RECENTES:10m}
        pontos-alta-velocidade: ${RISCO_CHALLENGER_PONTOS_ALTA_VELOCIDADE:40}
        limite-clientes-por-dispositivo: ${RISCO_CHALLENGER_LIMITE_CLIENTES_DISPOSITIVO:2}
        janela-dispositivo-compartilhado: ${RISCO_CHALLENGER_JANELA_DISPOSITIVO:24h}
        pontos-dispositivo-compartilhado: ${RISCO_CHALLENGER_PONTOS_DISPOSITIVO:45}
        limite-reprovacao: ${RISCO_CHALLENGER_LIMITE_REPROVACAO:65}
    politica:
      limite-valor-alto: ${RISCO_LIMITE_VALOR_ALTO:1000.00}
      limite-valor-muito-alto: ${RISCO_LIMITE_VALOR_MUITO_ALTO:5000.00}
      pontos-valor-alto: ${RISCO_PONTOS_VALOR_ALTO:15}
      pontos-valor-muito-alto: ${RISCO_PONTOS_VALOR_MUITO_ALTO:45}
      pais-base: ${RISCO_PAIS_BASE:BR}
      pontos-pais-divergente: ${RISCO_PONTOS_PAIS_DIVERGENTE:25}
      limite-compras-recentes: ${RISCO_LIMITE_COMPRAS_RECENTES:3}
      janela-compras-recentes: ${RISCO_JANELA_COMPRAS_RECENTES:10m}
      pontos-alta-velocidade: ${RISCO_PONTOS_ALTA_VELOCIDADE:35}
      limite-clientes-por-dispositivo: ${RISCO_LIMITE_CLIENTES_DISPOSITIVO:3}
      janela-dispositivo-compartilhado: ${RISCO_JANELA_DISPOSITIVO:24h}
      pontos-dispositivo-compartilhado: ${RISCO_PONTOS_DISPOSITIVO:40}
      limite-reprovacao: ${RISCO_LIMITE_REPROVACAO:70}
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: 1.0
---
spring:
  config.activate.on-profile: platform-threads
  threads.virtual.enabled: false
